name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts --no-audit --no-fund bare@1.36.0

      - name: Lint
        run: npm run lint

      - name: Fast tests
        run: npm run test:fast

      - name: Store tests
        run: npm run test:store

      - name: Type check (not blocking yet)
        continue-on-error: true
        run: npm run type-check

  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts --no-audit --no-fund bare@1.36.0

      - name: Full tests
        run: npm test
