name: Release to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch, minor, major, an exact X.Y.Z, or current (release the version already in package.json, or retry its publish)'
        type: string
        default: patch
      skip_tests:
        description: 'Skip test:fast and test:store (lint still runs)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts --no-audit --no-fund bare@1.36.0

      - name: Check, test, bump, tag and push
        id: release
        env:
          VERSION: ${{ inputs.version }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=("$VERSION" --ci)
          if [ "$SKIP_TESTS" = "true" ]; then args+=(--skip-tests); fi
          node scripts/release.mjs "${args[@]}"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout --quiet "refs/tags/$TAG"
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG holds package.json version $version"
            exit 1
          fi
          latest=$(npm view "$name" dist-tags.latest 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sed '/^$/d' | sort -V | tail -n1)
          if [ -n "$latest" ] && [ "$newest" != "$TAG" ]; then
            dist_tag="release-${TAG%.*}"
          else
            dist_tag=latest
          fi
          echo "Publishing $name@$TAG under the $dist_tag dist-tag"
          npm publish --provenance --access public --tag "$dist_tag"
