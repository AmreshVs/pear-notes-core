name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. 1.2.0 (made by npm run release)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the tag name
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$TAG\" is not a MAJOR.MINOR.PATCH release tag"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is a release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG holds package.json version $version"
            exit 1
          fi
          if ! git branch -r --contains HEAD | grep -Eq '^\s*origin/(main|v[0-9]+\.[0-9]+\.[0-9]+)$'; then
            echo "::error::tag $TAG is not on main or a vX.Y.Z release branch"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the version is not on npm yet
        env:
          TAG: ${{ inputs.tag }}
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$TAG" version 2>/dev/null | grep -q .; then
            echo "::error::$name@$TAG is already on npm"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Pack
        run: npm publish --dry-run

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          name=$(node -p "require('./package.json').name")
          latest=$(npm view "$name" dist-tags.latest 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sed '/^$/d' | sort -V | tail -n1)
          if [ -n "$latest" ] && [ "$newest" != "$TAG" ]; then
            dist_tag="release-${TAG%.*}"
          else
            dist_tag=latest
          fi
          echo "Publishing $name@$TAG under the $dist_tag dist-tag"
          npm publish --provenance --access public --tag "$dist_tag"
