name: Create release branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the release, e.g. 1.2.0. Creates the branch vVERSION from the selected branch with that version set.'
        type: string
        required: true

permissions:
  contents: read

jobs:
  branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create the release branch
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$VERSION\" is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          branch="v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::$branch already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::core $VERSION is already released (tag $VERSION) - pick a newer version"
            exit 1
          fi
          git checkout -q -b "$branch"
          node -e "
            const fs = require('fs')
            for (const file of ['package.json', 'package-lock.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'))
              json.version = process.env.VERSION
              if (json.packages?.['']) json.packages[''].version = process.env.VERSION
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n')
            }
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -qam "Start core release $VERSION"
          fi
          git push "$PUSH_URL" "HEAD:refs/heads/$branch"
          echo "Created $branch from $GITHUB_REF_NAME at version $VERSION"
